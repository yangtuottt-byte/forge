# 多服务编排:本机开发环境一键起全套依赖
# docker compose up -d 启动, docker compose ps 看状态, docker compose down 停止

services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env.docker # 含真实 LLM key:容器执行任务必需(见该文件注释)
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=docker
      - DB_HOST=pg
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env.docker # 含真实 LLM key:worker 真实调 LLM 必需
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=docker
      - DB_HOST=pg
      - REDIS_HOST=redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1 # 生产同源:经 nginx 反代 /api
    ports:
      - "5173:80" # 宿主机 5173 -> 容器 nginx 80
    depends_on:
      api:
        condition: service_started


  pg:
    image: postgres:16 # 官方PG 16轻量镜像
    environment:
      POSTGRES_USER: forge  # 容器内 PG 用户(对应settings.db_user)
      POSTGRES_PASSWORD: forge  # 对应 db_password
      POSTGRES_DB: forge  # 启动时自动建的库
    ports:
      - "5432:5432" # 宿主机 5432 -> 容器 5432
    volumes:
      - pg_data:/var/lib/postgresql/data # 数据卷:容器删了数据还在(不挂=删容器就鞭尸)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg_data: