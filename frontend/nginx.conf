server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 单页应用:前端路由(/login /dashboard 等)回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代到 api 服务(同源,规避跨域)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 提交任务接口(exact match):抢在 WS location 之前
    # 否则 POST /api/v1/tasks 会被 "/api/v1/tasks/" 的尾斜杠前缀当成目录请求,
    # nginx 自动 301 到 http://localhost/api/v1/tasks/(丢端口),前端 fetch 跳到无端口 host → NetworkError
    location = /api/v1/tasks {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 反代(升级专用),任务进度实时通道
    # 注意:/api/v1/tasks/{id}/ws 走这里;/api/v1/tasks/{id} 的 REST 也走这里,
    # Upgrade 头对普通 HTTP 请求无害,FastAPI 正常响应
    location /api/v1/tasks/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
