name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: cd backend && pip install -e ".[dev]"
      - name: Lint
        run: cd backend && ruff check app tests && ruff format --check app tests
      - names: Test
        run: cd backend && python -m pytest -q
        